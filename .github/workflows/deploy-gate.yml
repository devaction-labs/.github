# Reusable: decide whether a run is a deliberate deploy.
# Call from any app:
#   jobs:
#     gate:
#       uses: devaction-labs/.github/.github/workflows/deploy-gate.yml@v1
#       permissions: { pull-requests: read }
name: Deploy Gate

on:
  workflow_call:
    inputs:
      deploy_label:
        description: Label required on the release/hotfix PR
        type: string
        default: deploy
      branch_regex:
        description: Head-ref regex for allowed deploy branches (JS/PCRE style for gh --jq test())
        type: string
        default: "^(release|hotfix)/"
    outputs:
      proceed:
        description: "true when this run may proceed with heavy jobs / deploy"
        value: ${{ jobs.check.outputs.proceed }}

permissions:
  pull-requests: read

jobs:
  check:
    name: Check deploy label + release branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      proceed: ${{ steps.decide.outputs.proceed }}
    steps:
      - name: Decide whether to proceed
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          DEPLOY_LABEL: ${{ inputs.deploy_label }}
          BRANCH_REGEX: ${{ inputs.branch_regex }}
        run: |
          case "$EVENT_NAME" in
            schedule|workflow_dispatch)
              echo "proceed=true" >> "$GITHUB_OUTPUT"
              echo "Manual/scheduled trigger — always allowed."
              ;;
            pull_request)
              if echo "$PR_LABELS" | jq -e --arg l "$DEPLOY_LABEL" 'index($l)' > /dev/null \
                && [[ "$PR_HEAD_REF" =~ $BRANCH_REGEX ]]; then
                echo "proceed=true" >> "$GITHUB_OUTPUT"
                echo "PR from '$PR_HEAD_REF' with label '$DEPLOY_LABEL' — proceeding."
              else
                echo "proceed=false" >> "$GITHUB_OUTPUT"
                echo "PR from '$PR_HEAD_REF' missing '$DEPLOY_LABEL' or not matching $BRANCH_REGEX — skipping."
              fi
              ;;
            push)
              # gh api --jq does not accept jq --arg flags; pipe to jq instead.
              MATCH=$(gh api "repos/${REPO}/commits/${SHA}/pulls" \
                | jq --arg re "$BRANCH_REGEX" --arg l "$DEPLOY_LABEL" \
                  '[.[] | select(.head.ref | test($re)) | select(any(.labels[].name; . == $l))] | length')
              if [ "${MATCH:-0}" -gt 0 ]; then
                echo "proceed=true" >> "$GITHUB_OUTPUT"
                echo "Push traces to a merged deploy PR ($BRANCH_REGEX + label $DEPLOY_LABEL) — proceeding."
              else
                echo "proceed=false" >> "$GITHUB_OUTPUT"
                echo "Push has no associated deploy PR — skipping."
              fi
              ;;
            *)
              echo "proceed=false" >> "$GITHUB_OUTPUT"
              echo "Unrecognized event '$EVENT_NAME' — skipping by default."
              ;;
          esac
